<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Python GUI</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .calculator {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        #display {
            width: 100%;
            height: 50px;
            font-size: 1.5rem;
            text-align: right;
            margin-bottom: 15px;
            padding: 5px 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #fafafa;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #e4e6eb;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #d8dadf;
        }
        button.operator {
            background-color: #ff9500;
            color: white;
        }
        button.operator:hover {
            background-color: #e08400;
        }
        button.clear {
            background-color: #ff3b30;
            color: white;
        }
        button.clear:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly value="">
        
        <div class="buttons">
            <button class="clear" py-click="clear_display">C</button>
            <button py-click="press_btn" py-data-val="(">(</button>
            <button py-click="press_btn" py-data-val=")">)</button>
            <button class="operator" py-click="press_btn" py-data-val="/">/</button>
            
            <button py-click="press_btn" py-data-val="7">7</button>
            <button py-click="press_btn" py-data-val="8">8</button>
            <button py-click="press_btn" py-data-val="9">9</button>
            <button class="operator" py-click="press_btn" py-data-val="*">*</button>
            
            <button py-click="press_btn" py-data-val="4">4</button>
            <button py-click="press_btn" py-data-val="5">5</button>
            <button py-click="press_btn" py-data-val="6">6</button>
            <button class="operator" py-click="press_btn" py-data-val="-">-</button>
            
            <button py-click="press_btn" py-data-val="1">1</button>
            <button py-click="press_btn" py-data-val="2">2</button>
            <button py-click="press_btn" py-data-val="3">3</button>
            <button class="operator" py-click="press_btn" py-data-val="+">+</button>
            
            <button py-click="press_btn" py-data-val="0">0</button>
            <button py-click="press_btn" py-data-val=".">.</button>
            <button class="operator" style="grid-column: span 2;" py-click="calculate">=</button>
        </div>
    </div>

    <script type="py">
        from pyscript import document

        display = document.querySelector("#display")

        def press_btn(event):
            # Mengambil nilai dari atribut py-data-val pada tombol yang diklik
            val = event.target.getAttribute("py-data-val")
            display.value += val

        def clear_display(event):
            display.value = ""

        def calculate(event):
            try:
                # Mengevaluasi string matematika dengan aman via fungsi bawaan Python
                result = eval(display.value)
                display.value = str(result)
            except Exception:
                display.value = "Error"
    </script>

</body>
</html>
