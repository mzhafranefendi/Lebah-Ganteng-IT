            /* Mengatur kontainer agar membungkus kedua produk secara sejajar (Flexbox) */
            .product-container {

            /* Base class untuk produk card tanpa border */

            }

            .iframe-wrapper {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 550px; /* Tinggi disamakan agar sejajar secara vertikal dengan kalkulator */
                overflow: hidden;
            }

<style>
    .iphone-body {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f0f0f0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .calculator {
        width: 280px;
        background-color: black;
        padding: 20px;
        border-radius: 40px;
        box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
    }
    .display {
        color: white;
        font-size: 50px;
        text-align: right;
        padding: 20px 10px;
        margin-bottom: 10px;
        overflow-x: hidden;
    }
    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-gap: 12px;
    }
    .btn {
        border: none;
        border-radius: 50%;
        height: 55px;
        width: 55px;
        font-size: 22px;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.7; }
    .zero {
        grid-column: span 2;
        width: 122px;
        border-radius: 30px;
        text-align: left;
        padding-left: 22px;
    }
    .gray { background-color: #a5a5a5; color: black; }
    .dark-gray { background-color: #333333; color: white; }
    .orange { background-color: #ff9f0a; color: white; }
</style>

<script>
    // GANTI URL DI BAWAH INI dengan URL dari Localtunnel Google Colab Anda!
    // Contoh: https://rare-wolves-99.localtunnel.me
    const COLAB_URL = "MASUKKAN_URL_LOCALTUNNEL_COLAB_DISINI";

    async function sendToPython(action, value = '') {
        try {
            const response = await fetch(`${COLAB_URL}/calc`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ action: action, value: value })
            });
            const data = await response.json();
            
            // Mengubah tampilan layar sesuai data yang diproses Python
            document.getElementById('display').innerText = data.display;
        } catch (error) {
            console.error("Error sambungan ke Python Colab:", error);
            document.getElementById('display').innerText = "Conn Err";
        }
    }
</script>
