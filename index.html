        <style>
            /* --- Desain Tema Sarang Lebah (Beehive Grid) --- */
            
            .beehive-container {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 25px;
                margin: 40px auto;
                padding: 20px;
                max-width: 1000px;
            }

            .bee-member-card {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 180px;
                text-align: center;
            }

            /* Membuat Frame Foto Berbentuk Hexagon */
            .hex-frame {
                width: 160px;
                height: 180px;
                background: #ffb300; /* Warna kuning madu untuk border/background */
                clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
                display: flex;
                justify-content: center;
                align-items: center;
                transition: transform 0.3s ease, filter 0.3s ease;
                filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.2));
            }

            /* Efek hover interaktif ala lebah aktif */
            .bee-member-card:hover .hex-frame {
                transform: scale(1.05);
                background: #e65100; /* Berubah agak oranye saat di-hover */
            }

            /* Kontainer gambar di dalam hexagon agar pas melayang */
            .hex-inner {
                width: 148px; /* Sedikit lebih kecil dari hex-frame untuk efek border */
                height: 168px;
                background: #2c2214; /* Background gelap jika foto belum dimuat */
                clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
                overflow: hidden;
            }

            .hex-inner img {
                width: 100%;
                height: 100%;
                object-fit: cover; /* Memastikan foto tidak gepeng */
            }

            /* Desain Label Nama Anggota */
            .bee-name {
                margin-top: 15px;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-weight: bold;
                color: #211502;
                background: #ffe082; /* Warna kuning soft melambangkan madu */
                padding: 6px 12px;
                border-radius: 20px;
                font-size: 0.9rem;
                box-shadow: 0 2px 5px rgba(0,0,0,0.1);
                border: 1px solid #ffb300;
                width: 100%;
                box-sizing: border-box;
            }
        </style>
    </head>
