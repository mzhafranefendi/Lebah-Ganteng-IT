<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website "LEBAH GANTENG-IT"</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Tombol Kontrol Musik */
        #music-control {
            position: fixed; bottom: 20px; right: 20px; z-index: 9999;
            background: #FFB300; border: 3px solid #1E1E1E; padding: 12px 20px;
            border-radius: 50px; cursor: pointer; font-weight: bold; color: #1E1E1E;
            box-shadow: 4px 4px 0px #1E1E1E; transition: 0.1s;
        }
        #music-control:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #1E1E1E; background: #FFA000; }

        /* Layar Selamat Datang (Splash Screen) Tema Beehive */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #FFC107; 
            background-image: radial-gradient(#212121 15%, transparent 15%), radial-gradient(#FF9800 15%, transparent 15%);
            background-size: 40px 40px; background-position: 0 0, 20px 20px;
            display: flex; justify-content: center; align-items: center; z-index: 10000;
            transition: opacity 0.4s ease;
        }
        .splash-card {
            background: #FFFDE7; border: 5px solid #212121; padding: 40px;
            border-radius: 30px; text-align: center; max-width: 500px;
            box-shadow: 10px 10px 0px #212121;
        }
        .splash-logo { height: 90px; margin-bottom: 20px; filter: drop-shadow(3px 3px 0px #212121); }
        .splash-card h1 { color: #212121; font-size: 30px; margin-bottom: 10px; font-weight: 900; }
        .splash-card p { font-size: 16px; color: #424242; margin-bottom: 30px; line-height: 1.6; }
        
        .splash-btn {
            background: #FF8F00; color: white;
            border: 3px solid #212121; padding: 15px 35px; font-size: 18px;
            font-weight: bold; border-radius: 50px; cursor: pointer;
            box-shadow: 5px 5px 0px #212121; transition: 0.1s;
        }
        .splash-btn:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0px #212121; background: #212121; color: #FFC107; }
    </style>
</head>
<body>

    <audio id="bgMusic" src="sheandhim.mp3" loop></audio>
    
    <div id="music-control" onclick="toggleMusic()">🐝 Play/Pause Music</div>

    <div id="splash-screen">
        <div class="splash-card">
            <img src="logo.png" class="splash-logo" alt="Logo SMAN 71">
            <h1>🐝 LEBAH GANTENG-IT 🐝</h1>
            <p>Selamat datang di situs tugas Informatika Kelompok LEBAH-GANTENG-IT — Siswa Kelas 10 SMA Negeri 71 Jakarta.</p>
            <button class="splash-btn" onclick="startWebsite()">MASUK KE SARANG 🚀</button>
        </div>
    </div>

    <iframe src="home.html" name="mainFrame"></iframe>

    <script>
        const audio = document.getElementById('bgMusic');
        
        function startWebsite() {
            audio.play().catch(err => console.log("Interaksi diperlukan untuk memutar musik:", err));
            document.getElementById('splash-screen').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
            }, 400);
        }

        function toggleMusic() {
            if (audio.paused) { audio.play(); } 
            else { audio.pause(); }
        }
    </script>
</body>
</html>
